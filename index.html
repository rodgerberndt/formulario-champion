      (function () {
        try {
          var LOCK_CLASS = '__locked__';
          var STYLE_ID = '__scroll_lock__';
          var SESSION_KEY = 'champion_scroll_bootstrap_v3';
          var LOCK_TIMEOUT_MS = 550;
          var releaseTimer = null;
          var pinTimer = null;
          var rafId = null;
          var released = false;
          var firstLoadInTab = false;

          try {
            firstLoadInTab = sessionStorage.getItem(SESSION_KEY) !== '1';
            sessionStorage.setItem(SESSION_KEY, '1');
          } catch (e) {}

          var ensureStyle = function () {
            if (document.getElementById(STYLE_ID)) return;
            var style = document.createElement('style');
            style.id = STYLE_ID;
            style.textContent =
              'html.' + LOCK_CLASS + ',body.' + LOCK_CLASS + '{overflow:hidden!important;height:100%!important;}' +
              'body.' + LOCK_CLASS + '{position:fixed!important;inset:0!important;width:100%!important;touch-action:none!important;}';
            document.documentElement.appendChild(style);
          };

          var resetToTop = function () {
            try {
              if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
              if (window.location.hash) {
                history.replaceState(null, '', window.location.pathname + window.location.search);
              }
              window.scrollTo(0, 0);
              if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
              document.documentElement.scrollTop = 0;
              if (document.body) document.body.scrollTop = 0;
            } catch (e) {}
          };

          var applyLock = function () {
            ensureStyle();
            document.documentElement.classList.add(LOCK_CLASS);
            if (document.body) document.body.classList.add(LOCK_CLASS);
          };

          var clearLock = function () {
            document.documentElement.classList.remove(LOCK_CLASS);
            if (document.body) document.body.classList.remove(LOCK_CLASS);
          };

          var stopPinning = function () {
            if (pinTimer) {
              clearInterval(pinTimer);
              pinTimer = null;
            }
            if (rafId) {
              cancelAnimationFrame(rafId);
              rafId = null;
            }
          };

          var startPinning = function () {
            stopPinning();
            var tick = function () {
              if (released) return;
              resetToTop();
              rafId = requestAnimationFrame(tick);
            };
            pinTimer = setInterval(resetToTop, 50);
            tick();
          };

          var release = function () {
            if (released) return;
            released = true;
            stopPinning();
            clearLock();
            resetToTop();
          };

          var scheduleRelease = function (delay) {
            if (releaseTimer) clearTimeout(releaseTimer);
            releaseTimer = setTimeout(release, delay);
          };

          var boot = function () {
            released = false;
            applyLock();
            resetToTop();
            startPinning();
            scheduleRelease(LOCK_TIMEOUT_MS);
          };

          boot();

          if (!document.body) {
            document.addEventListener('DOMContentLoaded', function () {
              if (!released) document.body.classList.add(LOCK_CLASS);
              resetToTop();
            }, { once: true });
          }

          // A RECARGA FORÇADA DA LANDING SAIU EM 17/09/2026.
          //
          // O que havia aqui: no `load` da raiz, um `window.location.reload()`
          // uma vez por aba. O app inteiro era baixado, parseado e executado
          // DUAS VEZES em toda primeira visita — medido em 17/09: +0,8 s de LCP
          // no mobile e cerca de 2 s de CPU jogados fora, na página que recebe o
          // tráfego pago. Ele existia para contornar um estado de rolagem do
          // primeiro pintar; o trava-rolagem acima (applyLock/startPinning/
          // release) já resolve isso sem recarregar nada.
          //
          // A gambiarra `__championSkipPv` saiu junto: ela existia SÓ por causa
          // desta recarga, para o segundo load não contar um segundo PageView.
          window.addEventListener('load', function () {
            scheduleRelease(firstLoadInTab ? 120 : 80);
          }, { once: true });

          window.addEventListener('pageshow', function (event) {
            if (!event.persisted) return;
            boot();
            scheduleRelease(120);
          });

          // GUARDA CONTRA O SALTO TARDIO DO WEBKIT (25/09/2026).
          //
          // O bug: no iPhone, abrindo pelo navegador do Instagram, a página às
          // vezes salta sozinha para o fim logo depois de aparecer. Filmado em
          // 25/09: topo aos 3 s, rodapé aos 5 s, sem ninguém tocar na tela.
          //
          // Por que o trava-rolagem acima não pega: ele solta 120 ms depois do
          // `load`, e o WebKit restaura a posição da visita anterior DEPOIS
          // disso, quando o conteúdo abaixo da dobra (players, imagens) termina
          // de medir e a página ganha os seus 17 mil pixels. Nesse instante já
          // não há ninguém olhando. O `pageshow` também não resolve: ele só age
          // quando a página volta do cache (`event.persisted`), e este caso é
          // carga normal.
          //
          // Por isso o guarda aqui não trava nada: ele observa. Se a rolagem
          // pular sozinha na primeira janela de tempo, devolve ao topo; e some
          // no instante em que a pessoa encosta na tela, porque a partir daí
          // qualquer rolagem é dela e não pode ser desfeita.
          //
          // Só vale para quem chega no topo: se a página abriu já rolada (link
          // com âncora), não é este bug e o guarda nem começa.
          (function () {
            // A contagem começa no `load`, e não no parse do HTML: o salto
            // acontece DEPOIS que o conteúdo abaixo da dobra termina de medir,
            // que é justamente o que o `load` marca. Contando do parse, a
            // janela fecharia antes da hora em que o problema aparece.
            // 5 s depois do `load`. A janela é generosa de propósito: o salto
            // aparece quando o conteúdo abaixo da dobra termina de medir, e
            // isso depende da rede do celular. Ser generoso aqui não custa
            // nada, porque o guarda se desliga no primeiro toque e, no celular,
            // rolagem sem toque é sempre do navegador, nunca da pessoa.
            var JANELA_MS = 5000;
            var TOLERANCIA = 120;
            var inicio = Date.now();
            var vigiando = true;

            var desligar = function () {
              if (!vigiando) return;
              vigiando = false;
              window.removeEventListener('scroll', aoRolar);
            };

            var aoRolar = function () {
              if (!vigiando) return;
              if (Date.now() - inicio > JANELA_MS) { desligar(); return; }
              var y = window.pageYOffset || document.documentElement.scrollTop || 0;
              if (y > TOLERANCIA) {
                // Sem `behavior`, para ser instantâneo: uma animação aqui
                // brigaria com a rolagem que o navegador acabou de aplicar.
                window.scrollTo(0, 0);
                if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
              }
            };

            ['touchstart', 'wheel', 'keydown', 'pointerdown'].forEach(function (evt) {
              window.addEventListener(evt, desligar, { once: true, passive: true });
            });
            window.addEventListener('scroll', aoRolar, { passive: true });

            // Reinicia a contagem no `load`: até aqui a página ainda estava
            // medindo, e é depois disso que o salto aparece.
            var fechar = setTimeout(desligar, JANELA_MS);
            window.addEventListener('load', function () {
              inicio = Date.now();
              clearTimeout(fechar);
              fechar = setTimeout(desligar, JANELA_MS);
            }, { once: true });
          })();
        } catch (e) {}
      })();

          var url = 'https://%VITE_SUPABASE_PROJECT_ID%.supabase.co/functions/v1/landing-hit';
          var sp = new URLSearchParams(window.location.search);
          var get = function(k){ var v = sp.get(k); return (v && v.indexOf('{{') === -1) ? v : null; };
          var sid = window.__championSid || null;
          var cid = null;
          try {
            var raw = sessionStorage.getItem('champion_click_id');
            if (raw) { var p = JSON.parse(raw); cid = p && p.id ? p.id : null; }
          } catch(e){}
          var getCookie = function(n){ try { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; } };
          // O `_fbp`, criado por nós quando o pixel ainda não criou (24/09/2026).
          //
          // Este bloco roda antes do `fbevents.js` terminar de carregar, então na
          // PRIMEIRA visita de cada pessoa o cookie ainda não existe e o PageView
          // saía sem esse parâmetro. Medido no `capi_events_log`: `_fbp` em 18%
          // dos PageView e em 79% dos eventos de lead.
          //
          // Esperar pelo pixel atrasaria justamente o evento que precisa sair
          // cedo. Então invertemos a ordem: escrevemos primeiro, e o pixel adota
          // o valor que encontra em vez de criar outro. Formato obrigatório do
          // Meta, `fb.1.<epoch ms>.<inteiro>`; fora dele o valor é descartado.
          var garantirFbp = function(){
            try {
              var atual = getCookie('_fbp');
              if (atual && /^fb\.1\.\d+\.\d+$/.test(atual)) return atual;
              var h = window.location.hostname;
              var dom = /championadstudio\.com$/.test(h) ? '; domain=.championadstudio.com'
                    : /assessoriachampion\.com$/.test(h) ? '; domain=.assessoriachampion.com'
                    : (h.indexOf('.') === -1 ? '' : '; domain=' + h);
              var novo = 'fb.1.' + Date.now() + '.' + Math.floor(Math.random() * 1e10);
              document.cookie = '_fbp=' + novo + '; max-age=7776000; path=/' + dom + '; SameSite=Lax; Secure';
              // Devolve só o que o navegador aceitou: com cookie bloqueado a
              // escrita falha calada, e mandar um id que o pixel nunca verá
              // separaria o evento do navegador do evento do servidor, que é
              // pior do que mandar sem.
              return getCookie('_fbp');
            } catch(e){ return null; }
          };
          var payload = {
            session_id: sid,
            click_id: cid,
            path: window.location.pathname + window.location.search,
            page_url: window.location.href.split('#')[0],
            // Cookies do Meta. O `_fbc` continua vindo do pixel ou do fbclid;
            // o `_fbp` a gente garante acima.
            fbp: garantirFbp(),
            fbc: getCookie('_fbc'),
            // Só em produção: sem id, o `landing-hit` grava a visita mas NÃO
            // manda o PageView irmão pela CAPI. Teste não polui a conta.
            pv_event_id: (window.__championEhProducao && window.__championPvEventId) || null,
            referrer: document.referrer || null,
            utm_source: get('utm_source'),
            utm_medium: get('utm_medium'),
            utm_campaign: get('utm_campaign'),
            utm_content: get('utm_content'),
            utm_term: get('utm_term'),
            fbclid: get('fbclid'),
            gclid: get('gclid'),
            ttclid: get('ttclid')
          };
          var blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          var sent = false;
          if (navigator.sendBeacon) { sent = navigator.sendBeacon(url, blob); }
          if (!sent) {
            fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), keepalive: true }).catch(function(){});
          }
          sessionStorage.setItem('champion_landing_hit_fired', '1');
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
